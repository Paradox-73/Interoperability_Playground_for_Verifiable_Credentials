# Live core matrix (WP-10): Inji Certify 0.14.0 and Inji Verify 0.18.2 from the local stack, with the
# reference roles on the other side. The playground server must run on 28100 in host mode, because the
# stack's TLS front forwards ref.ps02.test and playground.ps02.test there:
#   npm run stack:up
#   PLAYGROUND_STACK=host npm start &        # or npm run dev
#   npm run matrix:live -- --spec live-core
#   npm run stack:down
# Expected outcomes are what the specifications require. Where a known upstream gap decides the outcome,
# the case expects verdict fail and names the gap (docs/gaps/gaps.json): a fixed gap turns the cell into a
# DIFF to review. Security-relevant probes are not part of this spec: their results are reported
# privately (docs/gaps lists them only as "Reported privately").
name: live-core
description: Inji Certify and Inji Verify against the reference roles, both mandatory formats, plus tamper cells against Inji Verify.
mode: live
cellSeconds: 20
defaults:
  wallet: ref-wallet
cases:
  # All-Inji issuance and verification (PS02 core path).
  - uniqueIdentifier: TC_PG_LIVE_01
    description: Inji Certify -> reference wallet -> Inji Verify, SD-JWT VC
    issuer: inji-certify
    verifier: inji-verify
    format: vc+sd-jwt
  - uniqueIdentifier: TC_PG_LIVE_02
    description: Inji Certify -> reference wallet -> Inji Verify, ldp_vc; blocked by G15 with G9 (no ldp_vp suite Inji Verify accepts for the P-256 holder key Certify requires)
    issuer: inji-certify
    verifier: inji-verify
    format: ldp_vc
    verdict: fail
  # Certify credentials checked by an independent verifier.
  - uniqueIdentifier: TC_PG_LIVE_03
    description: Inji Certify -> reference wallet -> reference verifier, SD-JWT VC (x5c chain to Certify's certificates)
    issuer: inji-certify
    verifier: ref-verifier
    format: vc+sd-jwt
  - uniqueIdentifier: TC_PG_LIVE_04
    description: Inji Certify -> reference wallet -> reference verifier, ldp_vc; blocked by G14 (Certify's DID document does not authorise its key for assertionMethod)
    issuer: inji-certify
    verifier: ref-verifier
    format: ldp_vc
    verdict: fail
  # Inji Verify against credentials and presentations from an independent issuer and wallet.
  - uniqueIdentifier: TC_PG_LIVE_05
    description: Reference issuer -> reference wallet -> Inji Verify, ldp_vc
    issuer: ref-issuer
    verifier: inji-verify
    format: ldp_vc
  - uniqueIdentifier: TC_PG_LIVE_06
    description: Reference issuer -> reference wallet -> Inji Verify, SD-JWT VC with a DID-named issuer key; blocked by G16 (x5c only)
    issuer: ref-issuer
    verifier: inji-verify
    format: vc+sd-jwt
    verdict: fail
  - uniqueIdentifier: TC_PG_LIVE_07
    description: Inji Verify must report an expired credential as expired ("Valid but expired")
    issuer: ref-issuer
    verifier: inji-verify
    format: ldp_vc
    scenario: expired
  # SD-JWT tamper cells use Certify's SD-JWT, which Inji Verify verifies, so the tamper is the only fault.
  - uniqueIdentifier: TC_PG_LIVE_08
    description: Inji Verify must reject a Certify SD-JWT VC with a flipped issuer signature
    issuer: inji-certify
    verifier: inji-verify
    format: vc+sd-jwt
    scenario: bad-signature
  - uniqueIdentifier: TC_PG_LIVE_09
    description: Inji Verify must reject a disclosure whose value the holder changed
    issuer: inji-certify
    verifier: inji-verify
    format: vc+sd-jwt
    scenario: altered-disclosure
  - uniqueIdentifier: TC_PG_LIVE_10
    description: Inji Verify must reject a disclosure the issuer never signed
    issuer: inji-certify
    verifier: inji-verify
    format: vc+sd-jwt
    scenario: unreferenced-disclosure
  - uniqueIdentifier: TC_PG_LIVE_11
    description: Inji Verify must reject a key binding JWT made for another verifier
    issuer: inji-certify
    verifier: inji-verify
    format: vc+sd-jwt
    scenario: kb-wrong-aud
  - uniqueIdentifier: TC_PG_LIVE_12
    description: Inji Verify must reject an SD-JWT VC presented with a key binding JWT of another key
    issuer: inji-certify
    verifier: inji-verify
    format: vc+sd-jwt
    scenario: holder-mismatch
  - uniqueIdentifier: TC_PG_LIVE_14
    description: Inji Verify must reject an ldp_vp signed by someone other than the holder
    issuer: ref-issuer
    verifier: inji-verify
    format: ldp_vc
    scenario: holder-mismatch
  - uniqueIdentifier: TC_PG_LIVE_13
    description: Inji Verify 0.18.2 does not advertise dc+sd-jwt, so the cell is reported as not supported
    issuer: ref-issuer
    verifier: inji-verify
    format: dc+sd-jwt
    verdict: not-supported
