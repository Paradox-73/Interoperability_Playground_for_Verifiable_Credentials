# Demo matrix (WP-17): the cells the recorded demo shows, run by `npm run demo` against the bundle.
# Run on the bundle, or on a host-mode server on 28100 with the stack up.
name: demo
description: The demo path - an independent run, Inji Certify to Inji Verify in both formats, a tamper run against Inji Verify, and an all-Inji run with Inji Web as the wallet.
mode: live
cellSeconds: 60
defaults:
  wallet: ref-wallet
cases:
  - uniqueIdentifier: TC_PG_DEMO_01
    description: Reference issuer -> reference wallet -> reference verifier, SD-JWT VC
    issuer: ref-issuer
    verifier: ref-verifier
    format: vc+sd-jwt
  - uniqueIdentifier: TC_PG_DEMO_02
    description: Inji Certify -> reference wallet -> Inji Verify, SD-JWT VC
    issuer: inji-certify
    verifier: inji-verify
    format: vc+sd-jwt
  - uniqueIdentifier: TC_PG_DEMO_03
    description: Inji Certify -> reference wallet -> Inji Verify, ldp_vc (Ed25519 holder key)
    issuer: inji-certify
    verifier: inji-verify
    format: ldp_vc
  - uniqueIdentifier: TC_PG_DEMO_04
    description: Inji Verify must reject a Certify SD-JWT VC whose issuer signature was flipped
    issuer: inji-certify
    verifier: inji-verify
    format: vc+sd-jwt
    scenario: bad-signature
  - uniqueIdentifier: TC_PG_DEMO_05
    description: All Inji - Inji Certify (certify-ac) -> Inji Web through Mimoto -> Inji Verify, ldp_vc
    issuer: inji-certify-ac
    wallet: inji-web
    verifier: inji-verify
    format: ldp_vc
