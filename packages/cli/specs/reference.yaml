# Reference matrix: every cell of the scenario catalogue that the reference issuer, wallet and verifier
# can run, in catalogue order (happy cells come before vp-replay, which replays an earlier presentation),
# in every applicable format and both OpenID4VP profiles, plus cells that must be reported as not
# supported. Run by `npm run matrix:reference` (CI and nightly). No Docker needed.
name: reference
description: Reference issuer, wallet and verifier against the scenario catalogue; no Inji module takes part.
mode: reference
cellSeconds: 1
defaults:
  issuer: ref-issuer
  wallet: ref-wallet
  verifier: ref-verifier
cases:
  - uniqueIdentifier: TC_PG_HAPPY_01
    description: 'Happy path, ldp_vc, inji-draft'
    format: ldp_vc
    vpProfile: inji-draft
    scenario: happy
    expected: VALID
  - uniqueIdentifier: TC_PG_HAPPY_02
    description: 'Happy path, ldp_vc, final-1.0'
    format: ldp_vc
    vpProfile: final-1.0
    scenario: happy
    expected: VALID
  - uniqueIdentifier: TC_PG_HAPPY_03
    description: 'Happy path, vc+sd-jwt, inji-draft'
