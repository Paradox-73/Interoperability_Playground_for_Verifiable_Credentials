# Checks every push and pull request: lint, formatting, types, unit and integration tests, build, and
# the playground container image. Later work adds the reference matrix and browser tests as jobs here.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  reference-matrix:
    name: reference matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run matrix:reference
      - name: matrix as job summary
        if: always()
        run: cat docs/interop-report/reference/matrix.md >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: browser tests (reference mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm exec -w @inji-playground/web -- playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          if-no-files-found: ignore

  image:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ps02-playground:ci .
      - name: health check of the built image
        run: |
          docker run -d --name ps02-playground-ci -p 28100:28100 ps02-playground:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:28100/api/health; then exit_code=0; break; fi
            exit_code=1; sleep 1
          done
          docker rm -f ps02-playground-ci
          exit $exit_code
