# Nightly interoperability run: the reference matrix (no Docker), then the live matrices against the local
# Inji stack (Certify, Inji Verify, Mimoto and Inji Web). The matrices are published as job summaries and
# docs/interop-report/ (with the redacted run of every cell) as an artifact.
#
# Target `collab` (repository variable INJI_TARGET, or the `target` input of a manual run) starts no stack and
# points the playground at the INJI_*_URL repository variables instead; docs/test-report/nightly-replay.md.
#
# Replayed locally with `node scripts/nightly-replay.mjs` (it runs the run steps of each job in
# order with their env); the reference job also ran under nektos/act. Whether a GitHub-hosted runner has enough
# memory for the stack with the holder-web profile (2.5 GiB measured locally) is not known yet.
name: interop-nightly

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Where the Inji modules run: local (stack on the runner) or collab (INJI_*_URL variables)'
        type: choice
        options: [local, collab]
        default: local

permissions:
  contents: read

concurrency:
  group: interop-nightly
  cancel-in-progress: false

jobs:
  reference:
    name: reference matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: reference matrix
        run: npm run matrix:reference -- --junit docs/interop-report/reference/junit.xml
      - name: matrix as job summary
        if: always()
        run: cat docs/interop-report/reference/matrix.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: interop-report-reference
          path: docs/interop-report/reference/
          if-no-files-found: warn

  live:
    name: live matrices (Inji stack or Collab)
    runs-on: ubuntu-latest
    needs: reference
    timeout-minutes: 60
    env:
      PLAYGROUND_RUN_DIR: ${{ github.workspace }}/run
      PLAYGROUND_STACK_PROFILES: holder-web
      # The TLS front reaches the playground on the host through the Docker bridge on Linux.
      PLAYGROUND_REF_UPSTREAM: http://172.17.0.1:28100
      # Scheduled runs have no inputs, so they follow the repository variable.
      INJI_TARGET: ${{ inputs.target || vars.INJI_TARGET || 'local' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: start the Inji stack
        if: env.INJI_TARGET != 'collab'
        run: npm run stack:up
      # One server for both live specs: certify-ac and Mimoto reach the playground at https://ref.ps02.test, and
      # certify-ac accepts only tokens issued there; Inji Verify resolves the reference issuer's did:web there.
      - name: start the playground server against the stack
        env:
          PLAYGROUND_STACK: host
          PLAYGROUND_HOST: 0.0.0.0
          PLAYGROUND_NETWORK_MAP: deploy/inji-stack/network-map.host.json
          PLAYGROUND_PUBLIC_URL: https://ref.ps02.test
          INJI_CERTIFY_URL: ${{ vars.INJI_CERTIFY_URL }}
          INJI_CERTIFY_AC_URL: ${{ vars.INJI_CERTIFY_AC_URL }}
          INJI_VERIFY_URL: ${{ vars.INJI_VERIFY_URL }}
          INJI_MIMOTO_URL: ${{ vars.INJI_MIMOTO_URL }}
          PLAYGROUND_TRUSTED_ISSUERS: ${{ vars.PLAYGROUND_TRUSTED_ISSUERS }}
        run: |
          if [ "$INJI_TARGET" = collab ]; then
            : "${INJI_CERTIFY_URL:?set the repository variable INJI_CERTIFY_URL}"
            : "${INJI_VERIFY_URL:?set the repository variable INJI_VERIFY_URL}"
          else
            unset INJI_CERTIFY_URL INJI_CERTIFY_AC_URL INJI_VERIFY_URL INJI_MIMOTO_URL PLAYGROUND_TRUSTED_ISSUERS
          fi
          nohup npm start > "$PLAYGROUND_RUN_DIR/server.log" 2>&1 &
          echo $! > "$PLAYGROUND_RUN_DIR/server.pid"
          for i in $(seq 1 60); do curl -sf http://localhost:28100/api/health && exit 0; sleep 1; done
          cat "$PLAYGROUND_RUN_DIR/server.log"; exit 1
      - name: live-core matrix
        id: core
        continue-on-error: true
        run: npm run matrix:live -- --spec live-core --junit docs/interop-report/live/junit-core.xml
      - name: live-holder-web matrix
        id: holder
        continue-on-error: true
        run: npm run matrix:live -- --spec live-holder-web --junit docs/interop-report/live/junit-holder-web.xml
      - name: matrices as job summary
        if: always()
        run: |
          echo "Inji target: $INJI_TARGET" >> "$GITHUB_STEP_SUMMARY"
          [ -f docs/interop-report/live/matrix.md ] && cat docs/interop-report/live/matrix.md >> "$GITHUB_STEP_SUMMARY"
          echo "memory at the end of the run:" >> "$GITHUB_STEP_SUMMARY"
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: interop-report-live
          path: |
            docs/interop-report/
            run/server.log
          if-no-files-found: warn
      - name: stop the playground server and the Inji stack
        if: always()
        run: |
          kill "$(cat "$PLAYGROUND_RUN_DIR/server.pid")" || true
          [ "$INJI_TARGET" = collab ] || npm run stack:down
      - name: fail when a live matrix differed from its spec
        if: steps.core.outcome == 'failure' || steps.holder.outcome == 'failure'
        run: exit 1
