# SPDX-License-Identifier: MIT
#
# Local Inji stack for the PS02 interoperability playground (Docker Compose project "ps02-inji").
#
#   npm run stack:up        init, start, wait for health, warm up (scripts/stack.mjs)
#   npm run stack:smoke     start, issue and verify one credential per format, stop
#   npm run stack:down      stop and remove containers and volumes
#
# Plain compose works too (no host tools needed): docker compose -f deploy/inji-stack/compose.yaml up
#
# Services without a profile always start (core): init, database, certify, certify-nginx, certify-seed,
# tls-front, verify-service. Opt-in profiles:
#   holder-web   mimoto-service and inji-web (the Inji Web wallet)
#   verify-ui    the Inji Verify web UI
#
# Versions (ran together on 2026-10-04, plan/research): inji-certify-with-plugins 0.14.0, mimoto 0.22.0,
# inji-web 0.17.0, inji-verify-service 0.18.2, postgres 15, nginx stable. Configuration files under config/,
# sql/ and nginx/ were imported unchanged from the upstream Inji repositories and then fixed in visible commits
# (UPSTREAM.md, README.md). Host ports stay inside the project range 28000-28999.
#
# Run-time material (test CA, TLS certificate, Mimoto client key) is created by the init service and the Mimoto
# wrapper into ${PLAYGROUND_RUN_DIR}/stack (default: <repo>/run/stack). PLAYGROUND_RUN_DIR must be absolute.

name: ps02-inji

services:
  # One-shot: test CA and TLS front certificate (scripts/stack-init.sh). nginx:stable is used because it ships
  # openssl and is already part of the stack.
  init:
    image: nginx:stable
    entrypoint: ['/bin/sh', '/ps02/stack-init.sh']
    restart: 'no'
    volumes:
      - ./scripts/stack-init.sh:/ps02/stack-init.sh:ro
      - ${PLAYGROUND_RUN_DIR:-../../run}/stack:/out

  # One Postgres for all three services: databases inji_certify, inji_mimoto and inji_verify, created from the
  # upstream SQL by scripts/postgres-init.sh. Trust authentication on the internal network only, so the team adds
  # no database password; the passwords in the upstream properties are ignored by the server.
  database:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/00-ps02-init.sh:ro
      - ./sql:/ps02-sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP on 127.0.0.1 only answers once the init scripts are done and the real server runs.
      test: ['CMD-SHELL', 'psql -h 127.0.0.1 -U postgres -d inji_verify -tAc "select 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # Inji Certify in pre-authorized code mode: profile "preauth" (config/certify-preauth.properties) makes Certify
  # its own authorization server, so no eSignet is needed. Its public name is http://certify-nginx:80.
  certify:
    image: injistack/inji-certify-with-plugins:0.14.0
    user: root
    # As for certify-ac: the Temurin CA entrypoint imports the stack's test CA (the JSON-LD context hosts are
    # answered by the TLS front), then hands over to the image's entrypoint and command.
    entrypoint: ['/__cacert_entrypoint.sh', './configure_start.sh']
    command:
      [
        'java',
        '-jar',
        '-Dloader.path=$${loader_path_env}',
        '-Dspring.cloud.config.label=$${spring_config_label_env}',
        '-Dspring.profiles.active=$${active_profile_env}',
        '-Dspring.cloud.config.uri=$${spring_config_url_env}',
        'certify-service.jar',
      ]
    environment:
      container_user: mosip
      active_profile_env: default,preauth
      SPRING_CONFIG_NAME: certify
      SPRING_CONFIG_LOCATION: /home/mosip/config/
      enable_certify_artifactory: 'false'
      download_hsm_client: 'false'
      mosip_certify_domain_url: http://certify-nginx:80
      USE_SYSTEM_CA_CERTS: '1'
    volumes:
      - ./config/certify-default.properties:/home/mosip/config/certify-default.properties:ro
      - ./config/certify-preauth.properties:/home/mosip/config/certify-preauth.properties:ro
      - ./config/vp_request_config.json:/home/mosip/config/vp_request_config.json:ro
      # Signing keys (PKCS#12 key store CERTIFY_PKCS12/local.p12, relative to the working directory /home/inji).
      # Kept in a volume next to the database, whose key_alias rows point into it.
      - certify-keys:/home/inji/CERTIFY_PKCS12
      - ${PLAYGROUND_RUN_DIR:-../../run}/stack/ca:/certificates:ro
    depends_on:
      database:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      # Issuer metadata rather than /actuator/health, which needs a token and answers 200 with an error body.
      # The first metadata call after start took 52 s in the 2026-10-04 trial, hence the long timeout.
      test:
        [
          'CMD-SHELL',
          'curl -sf -o /dev/null --max-time 90 http://localhost:8090/v1/certify/issuance/.well-known/openid-credential-issuer',
        ]
      interval: 10s
      timeout: 95s
      retries: 60
      start_period: 300s

  # The upstream sample nginx in front of Certify: issuer .well-known at the host root, Mimoto configuration
  # files, Certify API under /v1/certify. Alias "nginx" because mimoto-bootstrap.properties reads http://nginx/.
  certify-nginx:
    image: nginx:stable
    ports:
      - '28091:80'
    networks:
      default:
        aliases: [nginx]
    volumes:
      - ./nginx/certify-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/mimoto-issuers-config.json:/config/server/mimoto-issuers-config.json:ro
      - ./config/mimoto-trusted-verifiers.json:/config/server/mimoto-trusted-verifiers.json:ro
      - ./config/credential-template.html:/config/server/credential-template.html:ro
      - ./config/vp_request_config.json:/config/server/vp_request_config.json:ro
      - ./config/mosip-cbeff.xsd:/config/server/mosip-cbeff.xsd:ro
    depends_on:
      - certify
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf -o /dev/null http://localhost/mimoto-issuers-config.json']
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: adds the SD-JWT credential configuration (config/seed/) once Certify is healthy.
  certify-seed:
    image: nginx:stable
    entrypoint: ['/bin/sh', '/ps02/certify-seed.sh']
    restart: 'no'
    volumes:
      - ./scripts/certify-seed.sh:/ps02/certify-seed.sh:ro
      - ./config/seed:/seed:ro
    depends_on:
      certify:
        condition: service_healthy

  # HTTPS for certify.ps02.test, verify.ps02.test and ref.ps02.test inside the network (did:web, gap G2).
  tls-front:
    image: nginx:stable
    ports:
      - '28443:443'
    environment:
      # Where ref.ps02.test points: the playground on the host by default; the bundle sets the container.
      REF_UPSTREAM: ${PLAYGROUND_REF_UPSTREAM:-http://host.docker.internal:28100}
      NGINX_ENVSUBST_FILTER: '^REF_UPSTREAM$$'
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      default:
        # The context hosts: the Inji services fetch JSON-LD contexts from them for every ldp_vc they sign or
        # verify; the TLS front answers from its cache, so GitHub Pages' rate limit (HTTP 429, measured
        # 2026-10-06) cannot fail a run.
        aliases:
          [
            certify.ps02.test,
            certify-ac.ps02.test,
            verify.ps02.test,
            ref.ps02.test,
            playground.ps02.test,
            www.w3.org,
            w3id.org,
            piyush7034.github.io,
          ]
    volumes:
      - ./nginx/tls-front.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${PLAYGROUND_RUN_DIR:-../../run}/stack/tls:/etc/nginx/tls:ro
      # A volume, not a bind mount: nginx's cache files fail on a Docker Desktop bind mount (fstat, measured
      # 2026-10-06). It lives as long as the stack, so each document is fetched once per stack session.
      - context-cache:/var/cache/nginx/contexts
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'curl -s -o /dev/null --max-time 5 -k https://localhost/ || exit 1']
      interval: 5s
      timeout: 6s
      retries: 30

  # Inji Verify service 0.18.2. Its DID is did:web:verify.ps02.test:v1:verify (served through tls-front).
  # USE_SYSTEM_CA_CERTS: the image's Temurin entrypoint imports /certificates/*.crt (the test CA) into the JVM
  # trust store, so the did:web resolver accepts https://certify.ps02.test.
  verify-service:
    image: injistack/inji-verify-service:0.18.2
    user: root
    ports:
      - '28080:8080'
    environment:
      active_profile_env: default
      DATABASE_HOST: database
      DATABASE_PORT: '5432'
      DATABASE_NAME: inji_verify
      DATABASE_SCHEMA: verify
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: trust-auth-no-password
      INJI_VP_REQUEST_LONG_POLLING_TIMEOUT: '55000'
      # response_uri the wallet posts to: the TLS front, reachable from containers on this network and from the
      # host. Mimoto refuses an http response_uri (gap G24). Set a LAN address when a phone wallet is used.
      INJI_VP_SUBMISSION_BASE_URL: ${INJI_VERIFY_SUBMISSION_BASE_URL:-https://verify.ps02.test/v1/verify}
      INJI_DID_VERIFY_URI: did:web:verify.ps02.test:v1:verify
      INJI_DID_VERIFY_PUBLIC_KEY_URI: did:web:verify.ps02.test:v1:verify#key-0
      # Password of the sample key store baked into the image (same value as the upstream compose files).
      INJI_KEYSTORE_FILE_PASS: mosip
      INJI_VERIFY_REDIRECT_URI: http://localhost:28030
      INJI_VERIFY_RESPONSE_CODE_EXPIRY_TIME_IN_MINS: '5'
      INJI_VERIFY_CLAIMS_WITH_META_DATA: _sd,_sd_alg,iss,cnf,sub,aud,exp,nbf,iat,cti
      # Cookie flag: verify-service marks its transaction cookie Secure by default (application.properties
      # inji.verify.cookie-secure-value=true). Browsers refuse Secure cookies over plain http on any host other
      # than localhost, for example the LAN address used when a phone takes part, so the stack serves plain
      # http and turns the flag off, as the upstream application-local.properties does.
      INJI_VERIFY_COOKIE_SECURE_VALUE: 'false'
      USE_SYSTEM_CA_CERTS: '1'
    volumes:
      - ${PLAYGROUND_RUN_DIR:-../../run}/stack/ca:/certificates:ro
    depends_on:
      database:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null -T 10 http://localhost:8080/v1/verify/did.json']
      interval: 10s
      timeout: 12s
      retries: 60
      start_period: 180s

  # certify-ac (holder-web, WP-14): a second Inji Certify 0.14.0 in authorization code mode whose authorization
  # server is the playground's test authorization server, so Inji Web through Mimoto can download a credential
  # without eSignet. Its own database (the unchanged certify_init.sql), its own key store, the upstream farmer CSV
  # as data provider, and config/certify-ac.properties for what differs. Debug port 28093 on 127.0.0.1; its public
  # URL is https://ref.ps02.test/proxy/certify-ac (the playground's recording proxy).
  database-ac:
    image: postgres:15
    profiles: [holder-web]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      PS02_INIT_SQL: certify_init.sql /ps02-sql-team/certify-ac.sql
    volumes:
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/00-ps02-init.sh:ro
      - ./sql:/ps02-sql:ro
      - ./sql-team:/ps02-sql-team:ro
      - pgdata-ac:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'psql -h 127.0.0.1 -U postgres -d inji_certify -tAc "select 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  certify-ac:
    image: injistack/inji-certify-with-plugins:0.14.0
    profiles: [holder-web]
    user: root
    # The image starts with ./configure_start.sh, which does not import /certificates. The Temurin CA entrypoint
    # of the same image does, then hands over to the image's own entrypoint and command (both end in exec "$$@").
    entrypoint: ['/__cacert_entrypoint.sh', './configure_start.sh']
    command:
      [
        'java',
        '-jar',
        '-Dloader.path=$${loader_path_env}',
        '-Dspring.cloud.config.label=$${spring_config_label_env}',
        '-Dspring.profiles.active=$${active_profile_env}',
        '-Dspring.cloud.config.uri=$${spring_config_url_env}',
        'certify-service.jar',
      ]
    ports:
      - '127.0.0.1:28093:8090'
    environment:
      container_user: mosip
      active_profile_env: default,csvdp-farmer,ac
      SPRING_CONFIG_NAME: certify
      SPRING_CONFIG_LOCATION: /home/mosip/config/
      enable_certify_artifactory: 'false'
      download_hsm_client: 'false'
      mosip_certify_domain_url: https://ref.ps02.test/proxy/certify-ac
      # Trust the stack's test CA (the test authorization server's JWKS is on https://ref.ps02.test).
      USE_SYSTEM_CA_CERTS: '1'
    volumes:
      - ./config/certify-default.properties:/home/mosip/config/certify-default.properties:ro
      - ./config/certify-csvdp-farmer.properties:/home/mosip/config/certify-csvdp-farmer.properties:ro
      - ./config/certify-ac.properties:/home/mosip/config/certify-ac.properties:ro
      - ./config/farmer_identity_data.csv:/home/mosip/config/farmer_identity_data.csv:ro
      - ./config/vp_request_config.json:/home/mosip/config/vp_request_config.json:ro
      - certify-ac-keys:/home/inji/CERTIFY_PKCS12
      - ${PLAYGROUND_RUN_DIR:-../../run}/stack/ca:/certificates:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      database-ac:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf -o /dev/null --max-time 90 http://localhost:8090/v1/certify/issuance/.well-known/openid-credential-issuer',
        ]
      interval: 10s
      timeout: 95s
      retries: 60
      start_period: 300s

  # One-shot: adds the SD-JWT credential configuration to certify-ac (config/seed-ac/, certify-ac's DID).
  certify-ac-seed:
    image: nginx:stable
    profiles: [holder-web]
    entrypoint: ['/bin/sh', '/ps02/certify-seed.sh']
    restart: 'no'
    environment:
      CERTIFY_URL: http://certify-ac:8090/v1/certify
    volumes:
      - ./scripts/certify-seed.sh:/ps02/certify-seed.sh:ro
      - ./config/seed-ac:/seed:ro
    depends_on:
      certify-ac:
        condition: service_healthy

  # Mimoto 0.22.0, the backend of Inji Web. The service name is fixed: the inji-web image proxies /v1/mimoto/
  # to mimoto-service:8099. scripts/mimoto-start.sh creates the client key store, then starts the image as usual.
  mimoto-service:
    image: injistack/mimoto:0.22.0
    profiles: [holder-web]
    user: root
    entrypoint: ['/bin/sh', '/ps02/mimoto-start.sh']
    ports:
      - '28099:8099'
    environment:
      container_user: mosip
      active_profile_env: default
      SPRING_CONFIG_NAME: mimoto
      SPRING_CONFIG_LOCATION: /home/mosip/
      SPRING_CLOUD_BOOTSTRAP_LOCATION: /home/mosip/mimoto-bootstrap.properties
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/inji_mimoto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: trust-auth-no-password
      # Mimoto's sign-in is Google only. For the logged-in wallet (WP-14) its "Google" provider is the playground's
      # test authorization server: Mimoto checks the ID token's issuer (google.issuer), its audience (the client id)
      # and its signature (the provider's JWKS); the test server issues ID tokens with an email claim.
      # Inji Web's "Continue With Google" button (a browser) uses the same provider: the browser opens the test
      # server's /authorize on the playground's host port, which approves at once; Mimoto redeems the code as a
      # public client with PKCE. The redirect URI is fixed because Inji Web's nginx drops the port from Host.
      # Both URLs assume the default ports: with another INJI_WEB_URL or playground port, change them to match the
      # client the playground registers (${INJI_WEB_URL}/v1/mimoto/oauth2/callback/google, packages/server/src/app.ts).
      GOOGLE_OAUTH_CLIENT_ID: ps02-mimoto-login
      GOOGLE_OAUTH_CLIENT_SECRET: not-used-by-token-login
      GOOGLE_ISSUER: https://ref.ps02.test/ref/as
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_AUTHORIZATIONURI: http://localhost:28100/ref/as/authorize
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_TOKENURI: https://ref.ps02.test/ref/as/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_JWKSETURI: https://ref.ps02.test/ref/as/jwks.json
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_USERINFOURI: https://ref.ps02.test/ref/as/userinfo
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENTAUTHENTICATIONMETHOD: none
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECTURI: http://localhost:28004/v1/mimoto/oauth2/callback/google
      USE_SYSTEM_CA_CERTS: '1'
    volumes:
      - ./scripts/mimoto-start.sh:/ps02/mimoto-start.sh:ro
      - ./config/mimoto-default.properties:/home/mosip/mimoto-default.properties:ro
      - ./config/mimoto-bootstrap.properties:/home/mosip/mimoto-bootstrap.properties:ro
      - ./config/mimoto-issuers-config.json:/home/mosip/mimoto-issuers-config.json:ro
      - ./config/mimoto-trusted-verifiers.json:/home/mosip/mimoto-trusted-verifiers.json:ro
      - ${PLAYGROUND_RUN_DIR:-../../run}/stack/mimoto:/home/mosip/certs
      - ${PLAYGROUND_RUN_DIR:-../../run}/stack/ca:/certificates:ro
    depends_on:
      database:
        condition: service_healthy
      init:
        condition: service_completed_successfully
      certify-nginx:
        condition: service_started
      # Started before the seed, Mimoto answered RESIDENT-APP-028 for certify-ac's SD-JWT configuration until it
      # was recreated (2026-10-05).
      certify-ac-seed:
        condition: service_completed_successfully
    healthcheck:
      # /actuator/health reports 503 without Redis although the APIs work, so the issuer list is checked.
      test: ['CMD-SHELL', 'curl -sf -o /dev/null --max-time 20 http://localhost:8099/v1/mimoto/issuers']
      interval: 10s
      timeout: 25s
      retries: 60
      start_period: 240s

  # Inji Web 0.17.0 (nginx serving the React app, proxying /v1/mimoto/ to mimoto-service:8099).
  inji-web:
    image: injistack/inji-web:0.17.0
    profiles: [holder-web]
    ports:
      - '28004:3004'
    environment:
      DEFAULT_LANG: en
      MIMOTO_URL: http://localhost:28004/v1/mimoto
    depends_on:
      - mimoto-service
    healthcheck:
      # 127.0.0.1: nginx listens on IPv4 only, and busybox wget tries localhost as ::1 (refused).
      test: ['CMD-SHELL', 'wget -q -O /dev/null -T 5 http://127.0.0.1:3004/']
      interval: 10s
      timeout: 6s
      retries: 30

  # Inji Verify UI 0.18.2 (nginx serving the React app, proxying /v1/verify to verify-service:8080).
  # config/verify-ui-config.json is the upstream file, mounted unchanged.
  verify-ui:
    image: injistack/inji-verify-ui:0.18.2
    profiles: [verify-ui]
    ports:
      - '28030:8000'
    environment:
      DEFAULT_TITLE: Inji Verify
      DEFAULT_LANG: en
      INTERNET_CONNECTIVITY_CHECK_ENDPOINT: https://dns.google/
      INTERNET_CONNECTIVITY_CHECK_TIMEOUT: '10000'
      # G10: the upstream inji-verify compose writes {OVP_QR_HEADER-INJI_OVP://payload=} without the "$", so
      # the braces themselves became the QR header. The intended value is set plainly.
      OVP_QR_HEADER: INJI_OVP://payload=
      VERIFIABLE_CLAIMS_CONFIG_URL: /assets/config.json
      VP_SUBMISSION_SUPPORTED: 'false'
      CLIENT_ID: inji-verify-ui
      CLIENT_ID_DID: did:web:verify.ps02.test:v1:verify
      DISPLAY_TIMEOUT: '120000'
    volumes:
      - ./config/verify-ui-config.json:/usr/share/nginx/html/assets/config.json:ro
    depends_on:
      - verify-service
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null -T 5 http://127.0.0.1:8000/']
      interval: 10s
      timeout: 6s
      retries: 30

volumes:
  pgdata:
  pgdata-ac:
  certify-ac-keys:
  certify-keys:
  context-cache:
