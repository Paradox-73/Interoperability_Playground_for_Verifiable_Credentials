# SPDX-License-Identifier: MIT
#
# certify-ac: a second Inji Certify 0.14.0 for the holder-web profile, written for the PS02 playground (not an
# upstream file). Loaded after the unchanged upstream certify-default.properties and
# certify-csvdp-farmer.properties (active profiles default,csvdp-farmer,ac), so only these values differ.
#
# Why: Mimoto 0.22.0 (behind Inji Web) runs only the authorization code flow, and the core Certify of the stack
# runs in pre-authorized mode without an authorization endpoint (gaps G5, G6). certify-ac takes its access
# tokens from the playground's test authorization server instead of eSignet, and looks the holder up in the
# upstream farmer CSV by the token's sub (the test server logs in the CSV row id 2154189532).
#
# Every URL is one the containers reach: ref.ps02.test is the playground behind the stack's TLS front, and
# /proxy/certify-ac on it forwards to this container, so the playground records Mimoto's requests.

# Database of its own (service database-ac, created from the unchanged certify_init.sql).
mosip.certify.database.hostname=database-ac
mosip.certify.database.port=5432

# Public base URL of this issuer: through the playground's recording proxy.
mosip.certify.domain.url=https://ref.ps02.test/proxy/certify-ac
mosip.certify.identifier=${mosip.certify.domain.url}

# Authorization server: the playground's test authorization server.
mosip.certify.authorization.url=https://ref.ps02.test/ref/as
mosip.certify.authorization.default-server=https://ref.ps02.test/ref/as
mosip.certify.authn.issuer-uri=https://ref.ps02.test/ref/as
mosip.certify.authn.jwk-set-uri=https://ref.ps02.test/ref/as/jwks.json
mosip.certify.authn.allowed-audiences={ '${mosip.certify.domain.url}${server.servlet.path}/issuance/credential' }

# Issuer DID served by the TLS front at https://certify-ac.ps02.test/.well-known/did.json.
mosip.certify.data-provider-plugin.did-url=did:web:certify-ac.ps02.test
mosip.certify.credential-config.issuer.display={{'name': 'Inji Certify AC (local playground)','locale': 'en'}}
