# SPDX-License-Identifier: MIT
#
# Spring profile "preauth" for Inji Certify 0.14.0, written for the PS02 playground (not an upstream file).
# Loaded after certify-default.properties (active_profile_env=default,preauth), so every key here overrides the
# sample value.
#
# Certify runs as its own OAuth authorization server and issues through the OpenID4VCI pre-authorized code flow:
# the playground posts the holder's claims to /v1/certify/pre-authorized-data and receives a credential offer;
# no eSignet or other external authorization server is involved. Reference: inji-certify docs
# Pre-Authorized-Code.md and the commented "use certify as authorization server" block in
# certify-default.properties.

## Data provider plugin: claims come from the pre-authorized-data request, not from a registry.
mosip.certify.integration.scan-base-package=io.mosip.certify.mock.integration
mosip.certify.integration.audit-plugin=LoggerAuditService
mosip.certify.plugin-mode=DataProvider
mosip.certify.integration.data-provider-plugin=PreAuthDataProviderPlugin
mosip.certify.data-provider-plugin.id-field-prefix-uri=https://mosip.io/credential/
mosip.certify.data-provider-plugin.rendering-template-id=
mosip.certify.status-list.signature-crypto-suite=Ed25519Signature2020

## Issuer DID. The TLS front (nginx/tls-front.conf.template) serves https://certify.ps02.test/.well-known/did.json
## inside the compose network, so Inji Verify's did:web resolver, which only uses https, can fetch it (gap G2).
mosip.certify.data-provider-plugin.did-url=did:web:certify.ps02.test

## Certify as authorization server: tokens are issued and checked by Certify itself.
mosip.certify.authorization.url=${mosip.certify.domain.url}
mosip.certify.authn.issuer-uri=${mosip.certify.authorization.url}
mosip.certify.authn.jwk-set-uri=http://certify:8090/v1/certify/.well-known/jwks.json
mosip.certify.authn.allowed-audiences={ '${mosip.certify.identifier}/v1/certify/issuance/credential' }

mosip.certify.credential-config.issuer.display={{'name': 'Inji Certify (local playground)','locale': 'en'}}
